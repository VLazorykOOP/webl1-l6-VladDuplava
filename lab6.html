<body>

    <h1>Робота з векторною графікою (SVG)</h1>
    <p>Варіант №5: Статичний малюнок + Анімації</p>

    <div class="svg-container">
        <!-- 
             Полотно SVG. 
             ViewBox налаштований так, щоб вмістити координати.
             Масштаб: 1 одиниця на графіку = 40 пікселів.
             Центр координат (0,0) зміщено в точку (150, 150) на полотні.
        -->
        <svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
            
            <!-- 1. СТАТИЧНЕ ЗОБРАЖЕННЯ (40%) -->
            
            <!-- Сітка та Осі координат -->
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
                
                <!-- Шлях для тексту по кривій -->
                <path id="textCurve" d="M 50,350 Q 300,300 550,350" fill="transparent"/>
            </defs>

            <!-- Вісь X -->
            <line x1="10" y1="150" x2="580" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
            <text x="580" y="140" font-family="Arial" font-weight="bold">X</text>
            
            <!-- Вісь Y -->
            <line x1="150" y1="390" x2="150" y2="10" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
            <text x="160" y="20" font-family="Arial" font-weight="bold">Y</text>

            <!-- Група фігур (Сині) -->
            <g fill="blue" stroke="black" stroke-width="1">
                
                <!-- Коло 1 (Зліва) -->
                <!-- Центр x=-1.5, y=1.5. У SVG: x=150-(1.5*40)=90, y=150-(1.5*40)=90 -->
                <circle cx="90" cy="90" r="40">
                    <!-- 3.1. Анімація зміни кольору (10%) -->
                    <animate attributeName="fill" values="blue;red;blue" dur="4s" repeatCount="indefinite" />
                </circle>

                <!-- Прямокутник під колом 1 -->
                <!-- x=[-3, -1], y=[-1, 0]. SVG x=30, y=150. Width=80, Height=40 -->
                <rect x="30" y="150" width="80" height="40">
                    <!-- 3.5. Анімація перекручування (skew) (10%) -->
                    <animateTransform attributeName="transform" type="skewX" values="0;20;0;-20;0" dur="3s" repeatCount="indefinite" />
                </rect>

                <!-- Коло 2 (По центру) -->
                <!-- Центр x=1.5, y=1.5. SVG x=210, y=90 -->
                <circle cx="210" cy="90" r="40" />

                <!-- Квадрат малий (зверху) -->
                <!-- x=[2, 3], y=[2, 3]. SVG x=230, y=30. W=40, H=40 -->
                <rect x="230" y="30" width="40" height="40">
                    <!-- 3.4. Анімація зміни розміру (10%) -->
                    <!-- Зверніть увагу: scale робиться відносно початку координат, тому потрібен translate для корекції, або transform-origin в CSS -->
                    <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" repeatCount="indefinite" additive="sum"/>
                </rect>

                <!-- Квадрат малий (праворуч від кола) -->
                <!-- x=[3, 4], y=[1, 2]. SVG x=270, y=70 -->
                <rect x="270" y="70" width="40" height="40" />

                <!-- Ромб (по центру внизу) -->
                <!-- Центр (3, -1). Вершини: (2,-1), (3,0), (4,-1), (3,-2) -->
                <!-- SVG: (230, 190), (270, 150), (310, 190), (270, 230) -->
                <polygon points="230,190 270,150 310,190 270,230">
                    <!-- 3.3. Анімація обертання (10%) -->
                    <!-- rotate(градуси, центр_х, центр_у) -->
                    <animateTransform attributeName="transform" type="rotate" values="0 270 190; 360 270 190" dur="5s" repeatCount="indefinite" />
                </polygon>

                <!-- Квадрат (зліва внизу біля осі) -->
                <!-- x=[0, 1], y=[-2, -1]. SVG x=150, y=190 -->
                <rect x="150" y="190" width="40" height="40" />

                <!-- Прямокутник (найнижчий) -->
                <!-- x=[1, 3], y=[-3, -2]. SVG x=190, y=230. W=80, H=40 -->
                <rect x="190" y="230" width="80" height="40" />

                <!-- Квадрат (крайній правий) -->
                <!-- x=[4, 5], y=[-2, -1]. SVG x=310, y=190 -->
                <rect x="310" y="190" width="40" height="40">
                    <!-- 3.2. Анімація переміщення (10%) -->
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,50; 0,0" dur="2s" repeatCount="indefinite" />
                </rect>

            </g>

            <!-- 2. ТЕКСТ ПО КРИВІЙ (10%) -->
            <text font-size="20" fill="darkblue" font-weight="bold">
                <textPath href="#textCurve" startOffset="50%" text-anchor="middle">
                    Комп'ютерні аксесуари - Лабораторна №6
                </textPath>
            </text>
            
            <!-- Підписи на осях (засічки) -->
            <g font-size="10" text-anchor="middle">
                <text x="150" y="165">0</text>
                <text x="190" y="165">1</text>
                <text x="230" y="165">2</text>
                <text x="270" y="165">3</text>
                <text x="310" y="165">4</text>
                <text x="350" y="165">5</text>
                
                <text x="110" y="165">-1</text>
                <text x="70" y="165">-2</text>
                <text x="30" y="165">-3</text>
                
                <text x="140" y="110">1</text>
                <text x="140" y="70">2</text>
                <text x="140" y="190">-1</text>
                <text x="140" y="230">-2</text>
            </g>

        </svg>
    </div>

    <p class="footer-text">
        <i>Розробка: Дуплава Владислав</i>
    </p>

</body>
</html>
